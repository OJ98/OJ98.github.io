# Jekyll Configuration
title: Omkar Joshi
email: ojjoshi@ncsu.edu
description: PhD Candidate in Computer Science at NC State University
url: https://oj98.github.io
baseurl: ""
repository: OJ98/oj98.github.io

# Author Information
author:
  name: Omkar Joshi
  email: ojjoshi@ncsu.edu
  bio: PhD Candidate, NC State University
  location: Raleigh, NC
  avatar: /images/profile_1.jpg
  
  # Links
  github: OJ98
  googlescholar: https://scholar.google.com/citations?user=CPLqrZMAAAAJ&hl=en

# Build Settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Markdown processor
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - Dockerfile
  - markdown_generator/
  - talkmap/
